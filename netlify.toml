[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["node_modules/ffmpeg-static/**"]

[functions."video-queue-worker"]
  schedule = "*/1 * * * *"

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/v1/checkout/sessions"
  to = "/.netlify/functions/stripe-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/v1/checkout/sessions/search"
  to = "/.netlify/functions/stripe-checkout-sessions"
  status = 200
  force = true

[[redirects]]
  from = "/v1/checkout/sessions/:id"
  to = "/.netlify/functions/stripe-checkout-session-get?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/v1/checkout/sessions/:id/expire"
  to = "/.netlify/functions/stripe-checkout-session-expire?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/v1/refunds"
  to = "/.netlify/functions/stripe-refund"
  status = 200
  force = true

[[redirects]]
  from = "/api/health/providers"
  to = "/.netlify/functions/health-providers"
  status = 200
  force = true

[[redirects]]
  from = "/api/video-generation-test"
  to = "/.netlify/functions/video-generation-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/backend/health"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/tiktok/authorize"
  to = "/.netlify/functions/tiktok-authorize"
  status = 302
  force = true

[[redirects]]
  from = "/api/tiktok/callback"
  to = "/.netlify/functions/tiktok-callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/tiktok/stats"
  to = "/.netlify/functions/tiktok-stats"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/provider-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/developer/*"
  to = "/.netlify/functions/developer-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/characters"
  to = "/.netlify/functions/characters"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/backend/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
