[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["node_modules/ffmpeg-static/**"]

[functions."video-queue-worker"]
  schedule = "*/1 * * * *"

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/backend/health"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/backend/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
