<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100b"><meta name="description" content="FruityStory.io — création IA, bibliothèque, applications et Developer Platform."><link rel="stylesheet" href="/styles.css"><title>FruityStory.io</title></head><body><div id="app"></div><script>
const plans=[['Standard','7,99 € / mois','7 000 crédits'],['Premium','15,99 € / mois','15 000 crédits'],['Pro','20,99 € / mois','40 000 crédits'],['Ultra King 👑','200 € / mois','250 000 crédits'],['Ultra Premium Kingdom 👑','400 € / mois','550 000 crédits'],['Kingdom Ultra Pro 👑','900 € / an','400 fonctionnalités + 50 définissables'],['Developer','40 €','Accès Developer Platform']];
const pages={studio:['🎬','Studio',['Générer une vidéo','Créer une image','Créer une voix','Personnages','Montage','Séries','Modèles','Projets']],library:['📚','Bibliothèque',['Vidéos','Images','Voix','Personnages','Projets','Fichiers','Favoris','Corbeille']],developer:['👨‍💻','Developer',['Developer Platform','Projets','Clés API','Documentation','Quotas','Webhooks','Paramètres']],store:['🏪','Fruity Store',['Applications','Catégories','Mes publications','Publier une application','Achats']],apps:['📱','Applications',['Toutes les applications','Mes applications','Créer une application','Applications publiées']],profile:['👤','Profil',['Compte','Sécurité','Notifications','Préférences']],settings:['⚙️','Paramètres',['Général','Compte','Confidentialité','Sécurité','Notifications','Langue']],help:['🆘','Aide',['Centre d’aide','FAQ','Contacter le support','Documentation']]};
function go(p){location.hash=p;render()} function openMenu(){document.body.classList.add('menu-open')} function closeMenu(){document.body.classList.remove('menu-open')}
function drawer(){return `<div id="shade" onclick="closeMenu()"></div><aside id="drawer"><div class="drawer-head"><b>FruityStory.io</b><button onclick="closeMenu()">×</button></div><nav>${Object.entries(pages).map(([k,v])=>`<button onclick="go('${k}');closeMenu()"><span>${v[0]}</span>${v[1]}<i>›</i></button>`).join('')}<button onclick="go('subscription');closeMenu()"><span>💳</span>Abonnement<i>›</i></button></nav></aside>`}
function cards(items){return `<div class="grid">${items.map((x,i)=>`<button class="feature" onclick="alert('« ${x} » sera relié au backend après la construction des pages.')"><span>${['✨','🎥','🖼️','🎙️','👤','✂️','📁','⚡'][i%8]}</span><strong>${x}</strong><small>Ouvrir ›</small></button>`).join('')}</div>`}
function home(){return `<section class="hero"><div><p class="eyebrow">FRUITYSTORY.IO</p><h1>Crée. Imagine. Publie.</h1><p>Un espace sombre et moderne pour créer des vidéos et histoires de fruits avec l’IA, gérer ta bibliothèque et publier des applications.</p><div class="actions"><button class="primary" onclick="go('studio')">✨ Commencer à créer</button><button class="secondary" onclick="go('subscription')">Voir les abonnements</button></div></div><div class="orb">🍓<span>🍌</span><em>🍉</em></div></section><section class="stats"><div><b>0</b><small>crédits</small></div><div><b>0</b><small>projets</small></div><div><b>0</b><small>vidéos</small></div><div><b>—</b><small>abonnement</small></div></section><h2>Espaces principaux</h2>${cards(['Studio','Bibliothèque','Developer','Fruity Store','Applications','Abonnement'])}`}
function subscription(){return `<div class="page-title"><span>💳</span><div><p class="eyebrow">COMPTE</p><h1>Abonnement</h1><p>Les plans sont prêts pour le raccordement à Stripe côté backend.</p></div></div><div class="plans">${plans.map(p=>`<article class="plan ${p[0].startsWith('Kingdom Ultra Pro')?'featured':''}"><span>${p[0]}</span><h2>${p[1]}</h2><p>${p[2]}</p><button class="primary" onclick="alert('Checkout Stripe à relier : ${p[0]}')">Choisir</button></article>`).join('')}</div>`}
function page(k){let [icon,title,sub]=pages[k];if(k==='developer')return `<div class="page-title"><span>${icon}</span><div><p class="eyebrow">ESPACE</p><h1>${title}</h1><p>Accès protégé par l’abonnement Developer.</p></div></div><div class="lock"><div>🔐</div><h2>Developer Platform</h2><p>Un abonnement Developer actif est requis pour entrer dans cette page.</p><strong>40 €</strong><button class="primary" onclick="go('subscription')">S’abonner</button></div>`;return `<div class="page-title"><span>${icon}</span><div><p class="eyebrow">ESPACE</p><h1>${title}</h1><p>Les fonctionnalités apparaissent à l’intérieur de cette page.</p></div></div>${cards(sub)}`}
function render(){let k=location.hash.slice(1)||'home';let content=k==='home'?home():k==='subscription'?subscription():pages[k]?page(k):home();document.getElementById('app').innerHTML=`<header><button class="hamb" onclick="openMenu()">☰</button><div class="brand">Fruity<span>Story</span><small>.io</small></div><div class="top-actions"><button onclick="go('subscription')">💳</button><button onclick="go('profile')">👤</button></div></header><main>${content}</main><nav class="bottom"><button onclick="go('studio')">🎬<small>Studio</small></button><button onclick="go('library')">📚<small>Bibliothèque</small></button><button class="create" onclick="go('studio')">＋</button><button onclick="go('developer')">👨‍💻<small>Developer</small></button><button onclick="go('store')">🏪<small>Store</small></button></nav>${drawer()}`};window.addEventListener('hashchange',render);render();</script></body></html>
