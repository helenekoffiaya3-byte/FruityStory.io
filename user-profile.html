<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Profil — FruityStory.io</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}button{font:inherit;border:0;background:none;cursor:pointer}.page{max-width:720px;margin:auto;min-height:100vh;position:relative;padding-bottom:30px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top button{font-size:30px}.profile{text-align:center;padding:2px 18px 0}.avatar{width:160px;height:160px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:60px;background:radial-gradient(circle at 35% 30%,#ffb28e,#ad5060 52%,#1d1521);border:1px solid #ddd}.name{font-size:28px;font-weight:800;margin-top:12px}.handle{color:#888;font-size:17px;margin-top:3px}.stats{display:flex;justify-content:center;gap:0;margin:22px auto 14px;max-width:500px}.stat{width:150px;font-size:18px;font-weight:800}.stat+ .stat{border-left:1px solid #ddd}.stat small{display:block;color:#888;font-size:15px;font-weight:400;margin-top:4px}.buttons{display:flex;justify-content:center;gap:9px}.follow{background:#ff2855;color:#fff;border-radius:30px;padding:15px 48px;font-size:20px;font-weight:700}.message{background:#f1f1f1;border-radius:30px;padding:15px 48px;font-size:20px;font-weight:700}.more{width:62px;border-radius:50%;background:#f1f1f1;font-size:25px}.bio{font-size:18px;line-height:1.35;margin:20px auto 18px;max-width:600px}.tabs{border-bottom:1px solid #ddd;display:flex;justify-content:space-around;margin-top:12px}.tab{padding:15px 30px;font-size:28px;color:#777;position:relative}.tab.active{color:#111}.tab.active:after{content:'';position:absolute;height:3px;background:#111;border-radius:3px;bottom:-1px;left:22px;right:22px}.playlists{display:flex;gap:12px;overflow:auto;padding:18px 20px}.pill{flex:0 0 auto;background:#f1f1f1;border-radius:30px;padding:13px 20px;font-size:18px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#fff}.tile{aspect-ratio:9/13;background:linear-gradient(150deg,#e7b09b,#4a2735 50%,#151018);position:relative;display:flex;align-items:end;padding:10px;color:#fff;font-weight:700}.tile:nth-child(2){background:linear-gradient(150deg,#4d2a28,#f0b16c,#222)}.tile:nth-child(3){background:linear-gradient(150deg,#531827,#b33c68,#16151a)}.tile:nth-child(4){background:linear-gradient(150deg,#d9c98e,#fff,#4d7892)}.tile:nth-child(5){background:linear-gradient(150deg,#f5a1db,#ffe36a,#61a8e4)}.tile:nth-child(6){background:linear-gradient(150deg,#20252d,#c63b52,#111)}.tile:before{content:'Épinglé';position:absolute;left:7px;top:8px;background:#ff2855;padding:4px 8px}.views{font-size:14px}.reposts{display:none;padding:25px;text-align:center;color:#777}.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:10;align-items:flex-end}.sheet.open{display:flex}.share{width:min(100%,720px);margin:auto auto 0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}.sheethead{display:flex;align-items:center;justify-content:center;height:54px;font-size:20px;font-weight:800;position:relative}.sheethead button{position:absolute;right:0;font-size:30px}.shareperson{display:flex;align-items:center;gap:14px;padding:10px 0 18px}.mini{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff8b58,#7b315d);color:#fff;font-size:25px}.sharegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 10px;border-top:1px solid #eee;padding-top:20px}.shareitem{text-align:center;font-size:12px}.circle{width:62px;height:62px;margin:auto auto 8px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#eee;color:#555}.cblue{background:#287be7;color:#fff}.cgreen{background:#25c66d;color:#fff}.cteal{background:#2aa9c9;color:#fff}.cpink{background:#ef477f;color:#fff}.status{text-align:center;color:#888;font-size:13px;padding-top:12px}@media(max-width:480px){.page{width:100%}.avatar{width:150px;height:150px}.name{font-size:26px}.follow,.message{padding-left:35px;padding-right:35px}.sharegrid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><main class="page">
<header class="top"><button onclick="history.back()" aria-label="Retour">←</button><div></div><div><button aria-label="Notifications">♧</button><button onclick="openShare()" aria-label="Partager">↗</button></div></header>
<section class="profile"><div class="avatar">🐞</div><div class="name">dakMiraculous</div><div class="handle">@dakmiraculous_off</div>
<div class="stats"><div class="stat">6<small>Suivis</small></div><div class="stat">31,3 K<small>Followers</small></div><div class="stat">140,7 K<small>J'aime</small></div></div>
<div class="buttons"><button class="follow" id="follow">Suivre</button><button class="message" onclick="alert('Ouverture de la messagerie')">Message</button><button class="more" onclick="openShare()">⌄</button></div>
<div class="bio">TRAILERS ÉPISODES SPOILERS<br>dakmiraculous@gmail.com</div></section>
<div class="tabs"><button class="tab active" onclick="showTab('posts',this)">▥</button><button class="tab" onclick="showTab('reposts',this)">⇄</button></div>
<div id="posts"><div class="playlists"><button class="pill">▣ Miraculous World</button><button class="pill">▣ Miraculous</button><button class="pill">▣ Miraculous Ladybug</button></div><div class="grid"><div class="tile"><span class="views">▷ 391 K</span></div><div class="tile"><span class="views">▷ 181,6 K</span></div><div class="tile"><span class="views">▷ 144,9 K</span></div><div class="tile"><span class="views">▷ 11,4 K</span></div><div class="tile"><span class="views">▷ 7 556</span></div><div class="tile"><span class="views">▷ 8 922</span></div><div class="tile"><span class="views">▷ 6 204</span></div><div class="tile"><span class="views">▷ 4 901</span></div><div class="tile"><span class="views">▷ 2 480</span></div></div></div>
<div class="reposts" id="reposts">Les republications de cet utilisateur apparaîtront ici.</div>
</main>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeShare()"><section class="share"><header class="sheethead">Envoyer à<button onclick="closeShare()">×</button></header><div class="shareperson"><div class="mini">🐞</div><div><b>Miraculous<br>Ladybug 🐞</b></div></div><div class="sharegrid">
<div class="shareitem"><button data-action="Copier le lien"><div class="circle cblue">🔗</div>Copier le<br>lien</button></div><div class="shareitem"><button data-action="WhatsApp"><div class="circle cgreen">◔</div>WhatsApp</button></div><div class="shareitem"><button data-action="Facebook"><div class="circle cblue">f</div>Facebook</button></div><div class="shareitem"><button data-action="Telegram"><div class="circle cteal">➤</div>Telegram</button></div><div class="shareitem"><button data-action="SMS"><div class="circle">▰</div>SMS</button></div><div class="shareitem"><button data-action="Instagram Direct"><div class="circle cpink">◉</div>Instagram<br>Direct</button></div>
<div class="shareitem"><button data-action="Signaler"><div class="circle">⚑</div>Signaler</button></div><div class="shareitem"><button data-action="Bloquer"><div class="circle">⊘</div>Bloquer</button></div><div class="shareitem"><button data-action="Envoyer message"><div class="circle">➤</div>Envoyer<br>message</button></div><div class="shareitem"><button data-action="Code QR"><div class="circle">▦</div>Code QR</button></div>
</div><div class="status" id="status"></div></section></div>
<script>function openShare(){document.querySelector('#sheet').classList.add('open')}function closeShare(){document.querySelector('#sheet').classList.remove('open')}document.querySelector('#follow').onclick=function(){this.textContent=this.textContent==='Suivre'?'Suivi':'Suivre';this.style.background=this.textContent==='Suivi'?'#eee':'#ff2855';this.style.color=this.textContent==='Suivi'?'#111':'#fff'};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='Bloquer'&&confirm('Bloquer cet utilisateur ?')){document.querySelector('#status').textContent='Utilisateur bloqué'}else if(a==='Signaler'){document.querySelector('#status').textContent='Choisis une raison pour le signalement'}else{document.querySelector('#status').textContent=a+' sélectionné'}setTimeout(()=>document.querySelector('#status').textContent='',2200)});function showTab(tab,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelector('#posts').style.display=tab==='posts'?'block':'none';document.querySelector('#reposts').style.display=tab==='reposts'?'block':'none'}</script>
</body></html>
