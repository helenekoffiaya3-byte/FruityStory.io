<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FruityStory.io — Connexion</title><link rel="stylesheet" href="/styles.css"><script src="https://www.google.com/recaptcha/api.js" async defer></script><style>.auth-legal{margin:28px auto 0;max-width:620px;text-align:center;color:#777;font-size:13px;line-height:1.5;padding:0 18px 24px}.auth-legal a{color:#4f63a8;text-decoration:none}.auth-error{color:#9b2226;margin-top:12px}.auth-switch{display:flex;gap:8px;margin-bottom:18px}.auth-switch button{flex:1}.hidden{display:none}</style></head><body><main class="page auth"><div class="brand">🍓 FruityStory.io</div><section class="generator"><h1 id="title">Connexion</h1><div class="auth-switch"><button id="login-tab" class="btn primary" type="button">Se connecter</button><button id="register-tab" class="btn secondary" type="button">Créer un compte</button></div><a class="btn secondary" href="/api/auth/google/authorize">Continuer avec Google</a><div class="divider">ou</div><form id="auth-form"><label id="username-wrap" class="hidden">Nom d'utilisateur<input id="username" type="text" autocomplete="username" minlength="3" maxlength="30"></label><label>E-mail<input id="email" type="email" autocomplete="email" required placeholder="toi@exemple.com"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><div id="captcha" class="g-recaptcha" data-sitekey="6LdQW40tAAAAAJz7jTQyDxRPKON8TxsGc254Q-mC"></div><button id="submit-btn" class="btn primary" type="submit">Se connecter</button><p id="auth-error" class="auth-error" role="alert"></p></form></section><p class="auth-legal">En continuant avec un compte FruityStory.io, vous acceptez nos <a href="/settings.html">Conditions d'utilisation</a> et reconnaissez avoir lu notre <a href="/privacy-policy.html">politique de confidentialité</a>.</p></main><script>let mode='login';const form=document.getElementById('auth-form'),title=document.getElementById('title'),usernameWrap=document.getElementById('username-wrap'),username=document.getElementById('username'),password=document.getElementById('password'),submit=document.getElementById('submit-btn'),error=document.getElementById('auth-error'),loginTab=document.getElementById('login-tab'),registerTab=document.getElementById('register-tab');function setMode(next){mode=next;const register=mode==='register';title.textContent=register?'Créer un compte':'Connexion';usernameWrap.classList.toggle('hidden',!register);username.required=register;password.autocomplete=register?'new-password':'current-password';submit.textContent=register?'Créer mon compte':'Se connecter';loginTab.className='btn '+(register?'secondary':'primary');registerTab.className='btn '+(register?'primary':'secondary');}loginTab.onclick=()=>setMode('login');registerTab.onclick=()=>setMode('register');const params=new URLSearchParams(location.search);if(params.get('error'))error.textContent=params.get('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{const captcha=typeof grecaptcha!=='undefined'?grecaptcha.getResponse():'';if(!captcha){error.textContent='Veuillez confirmer que vous n’êtes pas un robot.';return;}const endpoint=mode==='register'?'/api/auth/register':'/api/auth/login';const body=mode==='register'?{username:username.value.trim(),email:document.getElementById('email').value.trim(),password:password.value}:{login:document.getElementById('email').value.trim(),password:password.value};const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Opération impossible');window.location.href='/dashboard.html';}catch(e){error.textContent=e instanceof Error?e.message:'Opération impossible.';}finally{submit.disabled=false;}});</script></body></html>
