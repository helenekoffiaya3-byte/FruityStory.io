<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FruityStory.io — Connexion</title><link rel="stylesheet" href="/styles.css"><script src="https://www.google.com/recaptcha/api.js" async defer></script><style>.auth-legal{margin:28px auto 0;max-width:620px;text-align:center;color:#777;font-size:13px;line-height:1.5;padding:0 18px 24px}.auth-legal a{color:#4f63a8;text-decoration:none}.auth-legal a:hover{text-decoration:underline}.auth-error{color:#9b2226;margin-top:12px}</style></head><body><main class="page auth"><div class="brand">🍓 FruityStory.io</div><section class="generator"><h1>Connexion</h1><a class="btn secondary" href="/api/auth/google/authorize">Continuer avec Google</a><div class="divider">ou</div><form id="login-form"><label>E-mail<input id="email" type="email" name="email" required placeholder="toi@exemple.com"></label><label>Mot de passe<input id="password" type="password" name="password" required></label><div class="g-recaptcha" data-sitekey="6LdQW40tAAAAAJz7jTQyDxRPKON8TxsGc254Q-mC"></div><button id="login-btn" class="btn primary" type="submit">Se connecter</button><p id="login-error" class="auth-error" role="alert"></p></form><a href="#">Mot de passe oublié ?</a><p>Pas encore de compte ? <a href="#">Créer un compte</a></p></section><p class="auth-legal">En continuant avec un compte FruityStory.io, vous acceptez nos <a href="/settings.html">Conditions d'utilisation</a> et reconnaissez avoir lu notre <a href="/privacy-policy.html">politique de confidentialité</a>.</p></main><script>const form=document.getElementById('login-form'),btn=document.getElementById('login-btn'),error=document.getElementById('login-error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';btn.disabled=true;try{const captcha=typeof grecaptcha!=='undefined'?grecaptcha.getResponse():'';if(!captcha){error.textContent='Veuillez confirmer que vous n’êtes pas un robot.';return;}const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({login:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Connexion impossible');window.location.href='/dashboard.html';}catch(e){error.textContent=e instanceof Error?e.message:'Connexion impossible.';}finally{btn.disabled=false;}});</script></body></html>
