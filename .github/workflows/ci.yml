name: FruityStory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Netlify configuration
        run: test -f netlify.toml && test -d netlify/functions

      - name: Validate frontend entry points
        run: |
          test -f index.html
          test -f generate.html
          test -f studio.html
          test -f dashboard.html
          test -f social.html
          test -f search.html
          test -f auth.html
          test -f settings.html
          test -f monetization.html
          test -f promote.html

      - name: Validate FSK developer platform
        run: |
          test -f backend/src/developer-platform.ts
          grep -q "fsk_" backend/src/developer-platform.ts
          grep -q "fsk_video_" backend/src/developer-platform.ts
          grep -q "fsk_ai_" backend/src/developer-platform.ts
          grep -q "fsk_payments_" backend/src/developer-platform.ts
          grep -q "createDeveloperKey" backend/src/developer-platform.ts
          grep -q "revokeDeveloperKey" backend/src/developer-platform.ts
