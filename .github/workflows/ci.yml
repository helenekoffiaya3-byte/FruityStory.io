name: FruityStory CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated frontend bundle contains no secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f main.js
          if grep -nE --binary-files=without-match '(sk_(live|test)_[A-Za-z0-9]{10,}|sk-proj-[A-Za-z0-9_-]{10,}|whsec_[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' main.js; then
            echo 'ERROR: secret-like value detected in generated frontend bundle main.js'
            exit 1
          fi
          if grep -nE --binary-files=without-match '(OPENAI_API_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|JWT_SECRET|DATABASE_URL|TIKTOK_CLIENT_SECRET|GOOGLE_CLIENT_SECRET)[[:space:]]*[:=]' main.js; then
            echo 'ERROR: server-side secret variable appears assigned in generated frontend bundle main.js'
            exit 1
          fi
          if grep -nE --binary-files=without-match 'process\.env\.(OPENAI_API_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|JWT_SECRET|DATABASE_URL|TIKTOK_CLIENT_SECRET|GOOGLE_CLIENT_SECRET)' main.js; then
            echo 'ERROR: server-side process.env secret reference detected in generated frontend bundle main.js'
            exit 1
          fi
          echo 'Generated frontend bundle secret scan passed.'

      - name: Verify source files contain no secret values
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE --exclude-dir=.git --exclude-dir=node_modules --include='*.html' --include='*.js' --include='*.ts' --include='*.json' --include='*.toml' '(sk_(live|test)_[A-Za-z0-9]{10,}|sk-proj-[A-Za-z0-9_-]{10,}|whsec_[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,})' .
          ! grep -RniE --exclude-dir=.git --exclude-dir=node_modules --include='*.html' --include='*.js' --include='*.ts' 'TIKTOK_CLIENT_SECRET[[:space:]]*=' .
          ! grep -RniE --exclude-dir=.git --exclude-dir=node_modules --include='*.html' --include='*.js' --include='*.ts' 'GOOGLE_CLIENT_SECRET[[:space:]]*=' .

      - name: Validate Netlify configuration
        run: test -f netlify.toml && test -d netlify/functions

      - name: Validate frontend and OAuth entry points
        run: |
          test -f index.html
          test -f generate.html
          test -f studio.html
          test -f dashboard.html
          test -f social.html
          test -f search.html
          test -f auth.html
          test -f settings.html
          test -f tiktok.html
          test -f promote.html
          test -f netlify/functions/google-authorize.ts
          test -f netlify/functions/google-callback.ts
          test -f netlify/functions/tiktok-authorize.ts
          test -f netlify/functions/tiktok-callback.ts
          test -f netlify/functions/tiktok-stats.ts
          test ! -e monetization.html
          test ! -e rewards.html

      - name: Validate FSK developer platform
        run: |
          test -f backend/src/developer-platform.ts
          test -f netlify/functions/developer-api.ts
          grep -q "KEY_TYPES" backend/src/developer-platform.ts
          grep -q "'video'" backend/src/developer-platform.ts
          grep -q "'ai'" backend/src/developer-platform.ts
          grep -q "'payments'" backend/src/developer-platform.ts
          grep -q "fsk_\${type}" backend/src/developer-platform.ts
          grep -q "createDeveloperKey" backend/src/developer-platform.ts
          grep -q "revokeDeveloperKey" backend/src/developer-platform.ts
          grep -q "createAccountDeveloperKey" backend/src/developer-platform.ts
          grep -q "createAccountDeveloperKey" netlify/functions/developer-api.ts
          grep -q "getDeveloperKeyBySecret" netlify/functions/developer-api.ts

      - name: Verify PayPal and Infobip are removed
        run: |
          test ! -e netlify/functions/paypal.ts
          ! grep -Rni --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml "paypal" .
          ! grep -Rni --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml "infobip" .

      - name: Work complete
        run: echo "FruityStory CI validation completed successfully"
