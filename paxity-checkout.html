<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FruityStory.io — Paiement Orange Money</title><link rel="stylesheet" href="/payment-flow.css"></head><body><main class="pay-shell"><header class="pay-head"><a class="back" href="/credits.html">‹</a><div><h1>Paiement Orange Money</h1><div class="secure">🛡 <b>Côte d'Ivoire · XOF</b></div></div></header><section class="card"><h2 id="planTitle">Abonnement</h2><p class="muted">Le montant exact de l'abonnement est déterminé côté serveur FruityStory.io.</p><label>Numéro Orange Money<input id="phone" inputmode="numeric" autocomplete="tel" placeholder="07XXXXXXXX" maxlength="10"></label><button id="pay" class="primary" style="margin-top:18px">Continuer avec Orange Money</button><p id="status" class="muted" style="margin-top:16px"></p></section><section id="payment" class="card center" hidden><h2>Paiement en attente</h2><p>Ouvre le parcours Orange Money pour terminer le paiement.</p><a id="payLink" class="primary" target="_blank" rel="noopener">Ouvrir Orange Money</a><p id="transaction" class="muted"></p></section><div class="footer-link"><a href="/balance.html">Retour au solde</a></div></main><script>(async()=>{const q=new URLSearchParams(location.search),plan=q.get('plan')||'standard';document.getElementById('planTitle').textContent='Abonnement '+plan.charAt(0).toUpperCase()+plan.slice(1);const token=()=>localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('accessToken');document.getElementById('pay').onclick=async()=>{const status=document.getElementById('status'),phone=document.getElementById('phone').value.replace(/\s+/g,'');if(!/^0\d{9}$/.test(phone)){status.textContent='Entre un numéro ivoirien valide (10 chiffres).';return}const t=token();if(!t){status.textContent='Connecte-toi à FruityStory.io avant de payer.';return}status.textContent='Création du paiement…';try{const r=await fetch('/api/payments/paxity/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({planId:plan,phoneNumber:phone,prefixPhone:'225'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Paiement impossible');document.getElementById('payLink').href=d.link||'#';document.getElementById('transaction').textContent='Transaction : '+d.transactionId;document.getElementById('payment').hidden=false;status.textContent='Demande créée. Statut : '+d.status; if(d.link) location.hash='payment';}catch(e){status.textContent=e.message||'Erreur de paiement.'}}})();</script></body></html>
