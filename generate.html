<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FruityStory.io — Générer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🍎 FruityStory.io</a>
  <nav>
    <a href="/dashboard.html">Profil</a>
    <a href="/studio.html">Studio</a>
    <a href="/publish.html">Publier</a>
  </nav>
</header>

<main class="page">
  <span class="eyebrow">GÉNÉRATION IA</span>
  <h1>Génère ta première vidéo</h1>
  <p>Crée un drama de fruits joué comme la vie réelle : dialogues et actions, sans narration.</p>

  <form class="generator" id="generatePageForm">
    <label>
      Idée du drama
      <textarea id="storyPrompt" required rows="7" placeholder="Ex. Pomito, garçon inspiré d’une pomme, rencontre Bananita dans un café et ils découvrent un secret..."></textarea>
    </label>

    <div class="form-grid">
      <label>
        Référence fruit
        <select id="fruit">
          <option>Pomme</option>
          <option>Banane</option>
          <option>Fraise</option>
          <option>Cerise</option>
          <option>Orange</option>
          <option>Pastèque</option>
          <option>Autre fruit</option>
        </select>
      </label>

      <label>
        Format
        <select id="format">
          <option>9:16</option>
          <option>16:9</option>
          <option>1:1</option>
        </select>
      </label>
    </div>

    <label>
      Nom du personnage
      <input id="characterName" placeholder="Ex. Pomito, Pomita, Banano, Bananita…">
    </label>

    <p class="message">Le nom peut être librement inspiré du fruit : aucune terminaison obligatoire.</p>

    <button class="btn primary" id="generatePageButton" type="submit">
      ✨ Préparer les scènes avec l’IA
    </button>

    <p id="status" class="message" role="status" aria-live="polite"></p>

    <section id="storyOutput" class="panel" hidden aria-live="polite"></section>
  </form>
</main>

<footer>© 2026 FruityStory.io</footer>

<script type="module">
  const form = document.querySelector('#generatePageForm');
  const button = document.querySelector('#generatePageButton');
  const status = document.querySelector('#status');
  const output = document.querySelector('#storyOutput');

  form?.addEventListener('submit', async (event) => {
    event.preventDefault();

    const prompt = document.querySelector('#storyPrompt')?.value?.trim() || '';
    const fruit = document.querySelector('#fruit')?.value || '';
    const characterName = document.querySelector('#characterName')?.value?.trim() || '';
    const format = document.querySelector('#format')?.value || '9:16';

    if (!prompt) return;

    button.disabled = true;
    status.textContent = '🤖 Préparation du drama…';
    output.hidden = true;
    output.innerHTML = '';

    const enrichedPrompt = [
      prompt,
      fruit ? `Fruit de référence : ${fruit}.` : '',
      characterName ? `Nom souhaité : ${characterName}.` : '',
      `Format vidéo souhaité : ${format}.`
    ].filter(Boolean).join('\n');

    try {
      const response = await fetch('/.netlify/functions/generate-story', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: enrichedPrompt })
      });

      const data = await response.json();

      if (!response.ok || !data.success || !data.story) {
        throw new Error(data.error || 'Impossible de générer le drama.');
      }

      const story = data.story;
      sessionStorage.setItem('fruitystory:lastStory', JSON.stringify({ ...data, format }));

      output.innerHTML = `
        <h2>${escapeHtml(story.title)}</h2>
        <h3>Personnages</h3>
        ${story.characters.map(character => `
          <article class="story-character">
            <h4>${escapeHtml(character.name)}</h4>
            <p><b>Fruit :</b> ${escapeHtml(character.fruit)}</p>
            <p><b>Apparence :</b> ${escapeHtml(character.appearance)}</p>
            <p><b>Vêtements :</b> ${escapeHtml(character.clothing)}</p>
            <p><b>Personnalité :</b> ${escapeHtml(character.personality)}</p>
          </article>
        `).join('')}
        <h3>Scènes</h3>
        ${story.scenes.map((scene, index) => `
          <article class="story-scene">
            <h4>Scène ${index + 1} — ${escapeHtml(scene.location)}</h4>
            <p>${escapeHtml(scene.description)}</p>
            ${scene.dialogues.map(dialogue => `
              <p><b>${escapeHtml(dialogue.characterId)}</b> : ${escapeHtml(dialogue.text)}</p>
            `).join('')}
          </article>
        `).join('')}
      `;

      output.hidden = false;
      status.textContent = `✅ ${story.scenes.length} scène(s) préparée(s).`;
    } catch (error) {
      console.error(error);
      status.textContent = error instanceof Error
        ? error.message
        : 'Une erreur est survenue.';
    } finally {
      button.disabled = false;
    }
  });

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }
</script>
</body>
</html>
