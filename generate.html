<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FruityStory.io — Générer</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">🍎 FruityStory.io</a><nav><a href="/dashboard.html">Profil</a><a href="/studio.html">Studio</a><a href="/publish.html">Publier</a></nav></header>
<main class="page"><span class="eyebrow">GÉNÉRATION IA</span><h1>Génère ta vidéo</h1><p>Crée un drama de fruits avec dialogues et actions, puis génère la vidéo avec Veo ou PixVerse.</p>
<form class="generator" id="generatePageForm">
<label>Idée du drama<textarea id="storyPrompt" required rows="7" placeholder="Ex. Pomito rencontre Bananita dans un café..."></textarea></label>
<div class="form-grid"><label>Fournisseur vidéo<select id="provider"><option value="veo">Google Veo</option><option value="pixverse">PixVerse</option></select></label><label>Format<select id="format"><option>9:16</option><option>16:9</option><option>1:1</option></select></label></div>
<div class="form-grid"><label>Référence fruit<select id="fruit"><option>Pomme</option><option>Banane</option><option>Fraise</option><option>Cerise</option><option>Orange</option><option>Pastèque</option><option>Autre fruit</option></select></label><label>Nom du personnage<input id="characterName" placeholder="Ex. Pomito"></label></div>
<button class="btn primary" id="prepareButton" type="submit">✨ Préparer les scènes</button><button class="btn primary" id="videoButton" type="button" disabled>🎬 Générer la vidéo</button>
<p id="status" class="message" role="status" aria-live="polite"></p><section id="storyOutput" class="panel" hidden></section><section id="videoOutput" class="panel" hidden></section>
</form></main><footer>© 2026 FruityStory.io</footer>
<script type="module">
const $=s=>document.querySelector(s);const form=$('#generatePageForm'),prepareButton=$('#prepareButton'),videoButton=$('#videoButton'),status=$('#status'),output=$('#storyOutput'),videoOutput=$('#videoOutput');let story=null;
form?.addEventListener('submit',async e=>{e.preventDefault();const prompt=$('#storyPrompt').value.trim();if(!prompt)return;prepareButton.disabled=true;videoButton.disabled=true;status.textContent='🤖 Préparation du drama…';output.hidden=true;videoOutput.hidden=true;const enriched=[prompt,`Fruit de référence : ${$('#fruit').value}.`,$('#characterName').value.trim()?`Nom souhaité : ${$('#characterName').value.trim()}.`:'' ].filter(Boolean).join('\n');try{const r=await fetch('/.netlify/functions/generate-story',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:enriched})});const d=await r.json();if(!r.ok||!d.success||!d.story)throw new Error(d.error||'Impossible de générer le drama.');story=d.story;sessionStorage.setItem('fruitystory:lastStory',JSON.stringify(d));output.innerHTML=`<h2>${h(story.title)}</h2><h3>Personnages</h3>${(story.characters||[]).map(c=>`<article><h4>${h(c.name)}</h4><p><b>Fruit :</b> ${h(c.fruit)}</p><p><b>Apparence :</b> ${h(c.appearance)}</p><p><b>Vêtements :</b> ${h(c.clothing)}</p><p><b>Personnalité :</b> ${h(c.personality)}</p></article>`).join('')}<h3>Scènes</h3>${(story.scenes||[]).map((s,i)=>`<article><h4>Scène ${i+1} — ${h(s.location||s.setting||'')}</h4><p>${h(s.description||s.action||'')}</p>${(s.dialogues||[]).map(d=>`<p><b>${h(d.characterId||d.character||'')}</b> : ${h(d.text||'')}</p>`).join('')}</article>`).join('')}`;output.hidden=false;videoButton.disabled=!(story.scenes&&story.scenes.length);status.textContent=`✅ ${(story.scenes||[]).length} scène(s) préparée(s).`;}catch(err){status.textContent=err instanceof Error?err.message:'Une erreur est survenue.';}finally{prepareButton.disabled=false;}});
videoButton?.addEventListener('click',async()=>{if(!story?.scenes?.length)return;const userId=localStorage.getItem('fruitystory:userId')||sessionStorage.getItem('fruitystory:userId');if(!userId){status.textContent='Connecte-toi pour générer une vidéo.';return;}videoButton.disabled=true;status.textContent='🎬 Envoi à la file de génération…';videoOutput.hidden=true;try{const provider=$('#provider').value,format=$('#format').value;const clips=story.scenes.map((scene,index)=>({prompt:buildScenePrompt(story,index),duration_seconds:Number(scene.duration_seconds)||5}));const r=await fetch('/.netlify/functions/generate-video',{method:'POST',headers:{'Content-Type':'application/json','x-user-id':userId},body:JSON.stringify({userId,provider,aspectRatio:format==='1:1'?'16:9':format,prompt:buildPrompt(story),clips,seconds:5,model:provider==='pixverse'?'v6':undefined})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Impossible de démarrer la vidéo.');status.textContent=`⏳ Vidéo en cours… ${d.quota?.remaining ?? '—'} génération(s) restante(s) aujourd’hui.`;await poll(d.jobId,provider);}catch(err){status.textContent=err instanceof Error?err.message:'Erreur de génération vidéo.';videoButton.disabled=false;}});
async function poll(jobId,provider){for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,5000));const r=await fetch(`/.netlify/functions/video-job-status?id=${encodeURIComponent(jobId)}&provider=${encodeURIComponent(provider)}`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur de suivi du job.');if(d.status==='failed')throw new Error(d.error||'La génération vidéo a échoué.');if(d.status==='completed'&&d.finalVideoUrl){videoOutput.innerHTML=`<h3>🎉 Vidéo prête</h3><video controls playsinline style="width:100%;max-width:720px" src="${h(d.finalVideoUrl)}"></video><p><a href="${h(d.finalVideoUrl)}" target="_blank" rel="noopener">Ouvrir la vidéo</a></p>`;videoOutput.hidden=false;status.textContent='✅ Vidéo générée avec succès.';videoButton.disabled=false;return;}status.textContent=`⏳ Génération en cours… (${i+1}/90)`;}status.textContent='⏳ La génération continue en arrière-plan. Tu peux revenir voir le résultat dans le Studio.';videoButton.disabled=false;}
function buildScenePrompt(s,index){const x=s.scenes[index];return `Film ${s.title||'FruityStory'}. Scène ${index+1}. ${x.location||x.setting||''}. ${x.description||x.action||''}. Actions: ${(x.actions||[]).join('; ')}. Dialogues: ${(x.dialogues||[]).map(d=>`${d.characterId||d.character||''}: ${d.text||''} (${d.emotion||'naturel'})`).join(' | ')}. Style cinématographique réaliste, continuité stricte des personnages, aucun narrateur, aucune voix off.`;}
function buildPrompt(s){return `${s.title||'FruityStory'}. Drama de fruits anthropomorphes. Aucun narrateur, aucune voix off. ${(s.scenes||[]).map((x,i)=>`Scène ${i+1}: ${x.location||x.setting||''}. ${x.description||x.action||''}. Actions: ${(x.actions||[]).join('; ')}. Dialogues: ${(x.dialogues||[]).map(d=>`${d.characterId||d.character||''}: ${d.text||''} (${d.emotion||'naturel'})`).join(' | ')}`).join(' ')}`;}
function h(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
</script></body></html>
